name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: 5.8.1
  KUBECONFORM_VERSION: 0.8.0
  ACTIONLINT_VERSION: 1.7.12
  KUBE_LINTER_VERSION: 0.8.3

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install yamllint
        run: python3 -m pip install --quiet yamllint==1.37.1
      - name: Lint YAML
        run: python3 -m yamllint -c .yamllint.yaml --strict .

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"
          ./actionlint -color

  manifests:
    name: kustomize and kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          kustomize_url="https://github.com/kubernetes-sigs/kustomize/releases/download"
          kustomize_url="${kustomize_url}/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          kubeconform_url="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "$kustomize_url" | tar -xz -C "$HOME/.local/bin" kustomize
          curl -fsSL "$kubeconform_url" | tar -xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Render and validate every kustomization
        run: RENDER_DIR=rendered scripts/validate.sh
      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered/
          retention-days: 7

  kube-linter:
    name: kube-linter
    runs-on: ubuntu-latest
    needs: manifests
    steps:
      - uses: actions/checkout@v5
      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          name: rendered-manifests
          path: rendered
      - name: Lint rendered workloads
        uses: stackrox/kube-linter-action@v1
        with:
          directory: rendered
          config: .kube-linter.yaml
          version: ${{ env.KUBE_LINTER_VERSION }}
