apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubectl apply -k bootstrap/dev
# Installs the self-managing Argo CD Application and the root Application
# for this cluster. See README, "Bootstrap a cluster".
resources:
  - ../argocd
  - root-app.yaml

patches:
  - target:
      kind: Application
      name: argocd
    patch: |-
      - op: add
        path: /spec/sources/0/helm/parameters
        value:
          - name: global.domain
            value: argocd.dev.example.com
          - name: server.ingress.annotations.cert-manager\.io/cluster-issuer
            value: letsencrypt-staging
