apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
    # kube-prometheus-stack only picks up ServiceMonitors carrying this label.
    release: kube-prometheus-stack
  annotations:
    # Lets the app sync on a cluster where kube-prometheus-stack has not
    # finished installing its CRDs yet.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
