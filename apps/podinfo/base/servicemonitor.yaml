apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
    # kube-prometheus-stack only picks up ServiceMonitors carrying this label.
    release: kube-prometheus-stack
  annotations:
    # The ServiceMonitor CRD now arrives at wave -1 with
    # prometheus-operator-crds, well before the apps ApplicationSet at wave 5,
    # so this is only a fallback for a cluster synced out of order by hand.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
