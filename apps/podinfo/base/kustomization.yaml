apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything the podinfo workload needs, with no environment-specific values.
# Overlays set the namespace, replica counts, resources, hostnames and image tag.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml
  - servicemonitor.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: podinfo
    includeSelectors: false
    includeTemplates: true
