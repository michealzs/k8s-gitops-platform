apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: podinfo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress controller may reach the HTTP port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: http
          protocol: TCP
    # Only Prometheus may scrape the metrics port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: http-metrics
          protocol: TCP
  egress:
    # DNS only. podinfo makes no outbound calls of its own.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
