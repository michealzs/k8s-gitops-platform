apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: podinfo
  labels:
    app.kubernetes.io/name: podinfo
spec:
  # maxUnavailable works at any replica count, including a single replica in
  # dev, so node drains are never blocked. Prod switches to minAvailable.
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: podinfo
