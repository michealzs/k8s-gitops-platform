apiVersion: v1
kind: Service
metadata:
  name: podinfo-canary
  labels:
    app.kubernetes.io/name: podinfo
spec:
  type: ClusterIP
  # Argo Rollouts adds a rollouts-pod-template-hash key to this selector at
  # runtime so only canary pods sit behind it. The prod ApplicationSet ignores
  # that key when diffing.
  selector:
    app.kubernetes.io/name: podinfo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: http-metrics
      port: 9797
      targetPort: http-metrics
      protocol: TCP
