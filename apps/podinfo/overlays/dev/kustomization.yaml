apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: podinfo

resources:
  - ../../base

labels:
  - pairs:
      environment: dev
    includeSelectors: false
    includeTemplates: true

# The image tag is pinned here, per environment. Promotion means copying this
# value into overlays/prod through a pull request.
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.15.0

patches:
  - path: patch-deployment.yaml
  - path: patch-hpa.yaml
  - path: patch-ingress.yaml
    target:
      kind: Ingress
      name: podinfo
