apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared by every cluster: the AppProjects and one Application per platform
# component, all pinned to their shared values.yaml. clusters/<name> adds the
# ApplicationSet for apps/, the cluster-specific Applications, and patches in
# each component's values-<name>.yaml.
resources:
  - projects.yaml
  - ../../platform/argo-rollouts
  - ../../platform/cert-manager
  - ../../platform/external-dns
  - ../../platform/external-secrets
  - ../../platform/ingress-nginx
  - ../../platform/karpenter
  - ../../platform/kube-prometheus-stack
  - ../../platform/kyverno
  - ../../platform/metrics-server
  - kyverno-policies.yaml
