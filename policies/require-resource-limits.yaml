apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must declare CPU and memory requests and a memory limit.
      Requests let the scheduler place pods and let Karpenter size nodes.
      Memory limits stop one container from taking down the node. CPU limits
      are deliberately not required: they throttle the workload instead of
      protecting the node, and requests already reserve the share we care about.
spec:
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
      validate:
        failureAction: Audit
        message: >-
          Containers must set resources.requests.cpu, resources.requests.memory
          and resources.limits.memory.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
