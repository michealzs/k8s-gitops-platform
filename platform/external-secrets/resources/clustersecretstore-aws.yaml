# One store for the whole cluster, backed by AWS Secrets Manager. The
# controller authenticates with the IAM role bound to its service account
# (IRSA), so there is no access key anywhere. Which secrets that role may
# read is decided in terraform-aws-platform.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
