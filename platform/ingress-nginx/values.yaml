# Shared values for ingress-nginx. Environment differences live in values-<env>.yaml.
controller:
  ingressClassResource:
    name: nginx
    default: true
  # Snippet annotations let any Ingress author inject nginx config; keep them off.
  allowSnippetAnnotations: false
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    proxy-body-size: 8m
    ssl-redirect: "true"
    hsts: "true"
    hsts-max-age: "31536000"
    log-format-escape-json: "true"
  service:
    type: LoadBalancer
    # These are the in-tree AWS cloud provider annotations, used deliberately:
    # the provider ships inside EKS, so the platform needs no extra controller.
    # aws-load-balancer-internal false keeps the NLB internet facing. Moving to
    # the AWS Load Balancer Controller would mean installing that controller
    # first and rewriting these annotations, which it does not read (it wants
    # aws-load-balancer-type external plus its own scheme and target-type keys).
    # Local preserves the client source IP, which the nginx access log and the
    # X-Forwarded-For chain both depend on.
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-internal: "false"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  admissionWebhooks:
    enabled: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
