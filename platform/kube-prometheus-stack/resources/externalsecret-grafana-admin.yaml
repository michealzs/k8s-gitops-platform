# Grafana's admin credentials live in AWS Secrets Manager under
# platform/grafana-admin with the keys "username" and "password". External
# Secrets copies them into a Secret that the chart references through
# grafana.admin.existingSecret. Nothing sensitive is in git.
#
# The remoteRef key has to start with the prefix the IRSA policy allows. In
# terraform-aws-platform that is var.external_secrets_secret_name_prefix on
# modules/eks, default "platform/", which the policy turns into the resource
# arn:PARTITION:secretsmanager:REGION:ACCOUNT:secret:platform/*. Renaming the
# secret out of platform/ means changing that variable in the same pull request.
#
# Wave 2, one wave after the ClusterSecretStore this refers to and one wave
# before kube-prometheus-stack reads the Secret. See docs/architecture.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/grafana-admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: platform/grafana-admin
        property: password
