# Shared values for Kyverno. The policies themselves are in /policies and are
# applied by the kyverno-policies Application after this chart is healthy.
crds:
  install: true
features:
  policyExceptions:
    enabled: true
    namespace: kyverno
admissionController:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
  container:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
backgroundController:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
cleanupController:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
reportsController:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
