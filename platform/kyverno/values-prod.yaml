# Three admission controller replicas is the minimum Kyverno supports for HA.
admissionController:
  replicas: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
backgroundController:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
cleanupController:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
reportsController:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
